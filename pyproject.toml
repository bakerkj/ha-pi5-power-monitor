[project]
name = "ha-pi5-power-monitor"
version = "0.0.1" # x-release-please-version
requires-python = ">=3.14.4,<3.15"
dependencies = []

[dependency-groups]
test = [
  "pytest-homeassistant-custom-component>=0.13.360",
]
dev = [
  { include-group = "test" },
  "mypy>=1.20.0",
]

[tool.mypy]
mypy_path = ["custom_components"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
required-version = "==0.12.20"
package = false
