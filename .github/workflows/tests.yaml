name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-suffix: tests
      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check
      # --no-default-groups: uv treats `dev` as a default group, so plain
      # `--group test` would still pull mypy into the test matrix.
      - name: Install the locked environment
        run: uv sync --no-default-groups --group test --frozen
      - name: Unit tests
        run: uv run --no-sync python -m pytest tests/ -v
